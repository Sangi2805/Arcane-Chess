services:
  arcane-chess:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: arcane-chess-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/arcane_chess
      - CLIENT_ORIGIN=http://localhost:3000
      - TRUST_PROXY=true
      - SESSION_COOKIE_SECURE=false
    env_file:
      - ./.env.example
    depends_on:
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  mongodb:
    image: mongo:7
    container_name: arcane-chess-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=arcane_chess
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/arcane_chess --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
    driver: local

